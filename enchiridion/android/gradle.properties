org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
android.useAndroidX=true

# Gradle optimization
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# AAPT2 timeout (in seconds, default is 30)
android.aapt2.timeout=1000

android.enableR8.fullMode=false
