name: enchiridion
description: A futuristic, offline-first reader application with intelligent typography and focus-driven design.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  scroll_to_index: ^3.0.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Platform Detection
  flutter_platform_widgets: ^6.0.2

  # Safe Area & Responsiveness
  flutter_screenutil: ^5.9.0

  # Supabase (Auth + Database)
  supabase_flutter: ^2.5.0

  # Clipboard
  flutter_markdown: ^0.7.4

  # Image picking (profile photo)
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  # External links (About screen: website, physical copy)
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Device fingerprinting for the one-account-per-device gate (see
  # lib/services/device_service.dart)
  device_info_plus: ^13.2.0
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  local_auth: ^3.0.2
  flutterwave_standard: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

  # Icon and Splash Screen Generation
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/icon/logo.png
    - assets/data/paediatrics.json
    - assets/data/exam_prep_questions.json
    - assets/data/resources/
    - assets/images/paediatrics/
    - assets/books/Paediatrics.png
    - assets/books/Dermatology.jpeg
    - assets/books/Internal Medicine.jpeg
    - assets/books/Obstetrics & Gynaecology.jpeg
    - assets/books/Orthopedics.jpeg
    - assets/books/Psychiatry.jpeg
    - assets/books/Radiology.jpeg
    - assets/books/Surgery.jpeg
    - assets/background/bg1.png
    - assets/background/bg2.png
    - assets/background/bg3.png
    - assets/background/bg4.png
    - assets/background/bg5.png
    - assets/resources/
    - assets/resources/content/
    - assets/resources/content/sutures/
    - assets/resources/content/iv_cannula/
    - assets/resources/content/abdominal_examination/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/logo.png"
  windows:
    generate: true
    image_path: "assets/icon/logo.png"
    icon_size: 48

# Splash Screen Configuration
flutter_native_splash:
  color: "#F8F9FA"
  color_dark: "#0A0E27"
  image: assets/icon/logo.png
  android_12:
    image: assets/icon/logo.png
    color: "#F8F9FA"
    color_dark: "#0A0E27"
  web: true
  android: true
  ios: false
