name: Android APKs

on:
  push:
    branches: [main]
    paths:
      - "enchiridion-app/enchiridion/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "enchiridion-app/enchiridion/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: enchiridion-app/enchiridion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so these APKs are signed with a throwaway debug key and will not install over another build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build split APKs
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: >
          flutter build apk --release --split-per-abi
          --build-number=${{ github.run_number }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID

      - name: Name each APK by build and device type
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "app-$abi-release.apk" "enchiridion-${{ github.run_number }}-$abi.apk"
          done

      - name: Show the signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs \
            "build/app/outputs/flutter-apk/enchiridion-${{ github.run_number }}-arm64-v8a.apk" \
            | grep -E "certificate DN|SHA-256 digest"

      # Each APK is uploaded on its own and unzipped, so it downloads as a
      # plain .apk file. With archive false the file name is the artifact name.
      - name: Upload arm64-v8a APK (most phones)
        uses: actions/upload-artifact@v7
        with:
          path: enchiridion-app/enchiridion/build/app/outputs/flutter-apk/enchiridion-${{ github.run_number }}-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a APK (older 32-bit phones)
        uses: actions/upload-artifact@v7
        with:
          path: enchiridion-app/enchiridion/build/app/outputs/flutter-apk/enchiridion-${{ github.run_number }}-armeabi-v7a.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK (emulators and Chromebooks)
        uses: actions/upload-artifact@v7
        with:
          path: enchiridion-app/enchiridion/build/app/outputs/flutter-apk/enchiridion-${{ github.run_number }}-x86_64.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
